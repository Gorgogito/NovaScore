[package]
name = "nova-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
midly = { version = "0.5", default-features = false, features = ["std", "alloc"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
