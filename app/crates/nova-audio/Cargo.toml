[package]
name = "nova-audio"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Audio -> notas (Basic Pitch, Apache-2.0, vía ONNX Runtime) para NovaScore"

[dependencies]
ort = { version = "2.0.0-rc.15", features = ["directml"] }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac", "alac"] }

[dev-dependencies]
nova-core = { path = "../nova-core" }
