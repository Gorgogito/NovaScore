[package]
name = "novascore"
version = "0.1.0"
description = "NovaScore - free music notation editor"
authors = ["NovaScore contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "novascore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nova-core = { path = "../crates/nova-core" }
nova-audio = { path = "../crates/nova-audio" }
svg2pdf = "0.13"
pdf-writer = "0.12"
ureq = "3"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
